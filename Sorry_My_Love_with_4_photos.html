<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sorry, My Love</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;700&family=Kalam:wght@400;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column like a letter you scroll through. Envelope opener, the letter, then small hands-on things (flip cards, coupons, photos) and one last question. */
:root {
  --bg: #F7EEF6;
  --fg: #34203F;
  --muted: #7B6585;
  --paper: #FFFAFB;
  --paper-ink: #3B2747;
  --rule: #F0DDE6;
  --accent: #D93F6B;
  --accent-ink: #FFFFFF;
  --butter: #F6C85A;
  --butter-ink: #4A3510;
  --card: #FFFFFF;
  --line: #E6D2E4;
  --env: #E9B8CC;
  --env2: #F1CADA;
  --env3: #DDA2BB;
  --shadow: rgba(80, 30, 80, 0.16);
  --font-display: 'DynaPuff', ui-rounded, 'Trebuchet MS', sans-serif;
  --font-hand: 'Kalam', 'Segoe Print', 'Comic Sans MS', cursive;
  --font-ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1224; --fg: #F3E4F1; --muted: #B49BBE; --paper: #2C1D37; --paper-ink: #F6E9F3;
    --rule: #3B2849; --accent: #FF7C9E; --accent-ink: #2A0F1A; --butter: #F2C45C; --butter-ink: #3A2A08;
    --card: #291A33; --line: #42304F; --env: #6B3F5E; --env2: #7C4A6D; --env3: #8F5B80; --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1224; --fg: #F3E4F1; --muted: #B49BBE; --paper: #2C1D37; --paper-ink: #F6E9F3;
  --rule: #3B2849; --accent: #FF7C9E; --accent-ink: #2A0F1A; --butter: #F2C45C; --butter-ink: #3A2A08;
  --card: #291A33; --line: #42304F; --env: #6B3F5E; --env2: #7C4A6D; --env3: #8F5B80; --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.6;
  margin: 0;
  padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.h { width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: -0.12em; }

h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 800; color: var(--accent); margin: 0 0 10px; }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 46ch; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.hero h1 { font-size: clamp(2.8rem, 14vw, 5rem); }
.hero h1 span { color: var(--accent); }
.env-wrap { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 18px; }
.env { all: unset; position: relative; display: block; width: min(300px, 78vw); aspect-ratio: 3 / 2; perspective: 700px; cursor: pointer; }
.env:focus-visible { outline: 3px solid var(--accent); outline-offset: 8px; }
.env-back, .env-front, .env-flap, .env-note { position: absolute; }
.env-back { inset: 0; background: var(--env); border-radius: 10px; box-shadow: 0 14px 28px -10px var(--shadow); }
.env-note { left: 9%; right: 9%; top: 8%; bottom: 14%; background: var(--paper); border-radius: 6px; transition: transform 0.7s 0.25s ease; z-index: 1;
  display: grid; place-items: center; color: var(--accent); font-size: 2rem; }
.env-front { inset: 0; background: var(--env2); border-radius: 10px; clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); z-index: 2; }
.env-flap { left: 0; right: 0; top: 0; height: 56%; background: var(--env3); border-radius: 10px 10px 0 0; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform 0.6s ease; z-index: 3; }
.env-seal { position: absolute; left: 50%; top: 46%; translate: -50% -50%; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 1.1rem; z-index: 4; transition: opacity 0.3s; box-shadow: 0 3px 8px var(--shadow); }
.env[aria-expanded="true"] .env-flap { transform: rotateX(180deg); z-index: 0; }
.env[aria-expanded="true"] .env-seal { opacity: 0; }
.env[aria-expanded="true"] .env-note { transform: translateY(-34%); }
.env-hint { color: var(--muted); font-size: 0.9rem; margin: 0; }

/* letter */
.paper {
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 6px;
  padding: clamp(24px, 6vw, 44px);
  box-shadow: 0 18px 40px -18px var(--shadow), 0 0 0 1px var(--line);
  font-family: var(--font-hand);
  font-size: clamp(1.2rem, 4.4vw, 1.4rem);
  line-height: 1.9;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.9em - 1px), var(--rule) calc(1.9em - 1px), var(--rule) 1.9em);
  background-position: 0 clamp(24px, 6vw, 44px);
}
.paper p { margin: 0 0 1.9em; max-width: 36em; }
.paper .greet { font-weight: 700; font-size: 1.15em; }
.paper .sign { margin: 0; }
.paper .sign b { color: var(--accent); }

/* flip cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
.flip { all: unset; display: grid; perspective: 900px; cursor: pointer; min-height: 150px; }
.flip:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 16px; }
.flip .face { grid-area: 1 / 1; border-radius: 16px; padding: 20px; backface-visibility: hidden; transition: transform 0.55s ease; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.flip .front { background: var(--accent); color: var(--accent-ink); }
.flip .front strong { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; font-weight: 700; }
.flip .front small { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; opacity: 0.85; }
.flip .back { background: var(--card); color: var(--fg); box-shadow: inset 0 0 0 2px var(--accent); transform: rotateY(180deg); justify-content: center; font-size: 1.02rem; }
.flip[aria-pressed="true"] .front { transform: rotateY(180deg); }
.flip[aria-pressed="true"] .back { transform: rotateY(360deg); }


/* photos */
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 22px 18px; margin-top: 28px; }
.polaroid { background: var(--card); padding: 10px 10px 12px; border-radius: 4px; box-shadow: 0 10px 22px -10px var(--shadow), 0 0 0 1px var(--line); rotate: var(--tilt, 0deg); margin: 0; }
.polaroid:nth-child(odd) { --tilt: -2deg; }
.polaroid:nth-child(even) { --tilt: 1.8deg; }
.polaroid:nth-child(3n) { --tilt: -1deg; }
.shot { aspect-ratio: 1; width: 100%; border-radius: 2px; background: var(--rule); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 0.8rem; padding: 10px; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .h { font-size: 1.6rem; color: var(--accent); display: block; margin: 0 auto 4px; }
.polaroid figcaption { font-family: var(--font-hand); font-size: 1.05rem; margin-top: 8px; text-align: center; line-height: 1.3; }

/* final question */
.final { background: var(--card); border-radius: 22px; padding: clamp(24px, 6vw, 40px); box-shadow: 0 0 0 1px var(--line); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.final h2 { font-size: clamp(2rem, 9vw, 3rem); }
.answer { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; min-height: 120px; width: 100%; }
.btn { border: 0; border-radius: 999px; padding: 14px 30px; font-weight: 800; font-size: 1.05rem; }
.btn.yes { background: var(--accent); color: var(--accent-ink); scale: var(--yes, 1); transition: scale 0.3s; box-shadow: 0 8px 18px -8px var(--shadow); }
.btn.no { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); transition: translate 0.25s ease; translate: var(--dx, 0) var(--dy, 0); }
.thanks { font-family: var(--font-hand); font-size: 1.35rem; line-height: 1.6; max-width: 28em; color: var(--paper-ink); margin: 0; }
.thanks[hidden] { display: none; }
footer { text-align: center; color: var(--muted); font-size: 0.9rem; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>

  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
</svg>

<div class="wrap">
  <header class="hero">
    <div>
      <p class="eyebrow">For you</p>
      <h1>I'm sorry<span>.</span></h1>
      <p class="lede">I wanted to say a few things.</p>
    </div>
    <div class="env-wrap">
      <button class="env" id="env" aria-expanded="false" aria-label="Open the envelope">
        <span class="env-back"></span>
        <span class="env-note"><svg class="h"><use href="#heart"/></svg></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal"><svg class="h"><use href="#heart"/></svg></span>
      </button>
      <p class="env-hint" id="envHint">Tap the envelope</p>
    </div>
  </header>

  <main style="display:contents">
    <article class="paper" id="letter" aria-label="The letter"></article>

    <section aria-labelledby="usH">
      <p class="eyebrow">A few memories</p>
      <h2 id="usH">Us</h2>
      <p class="lede">Some moments I wanted to keep here.</p>
      <div class="photos" id="photos"></div>
    </section>

    <section class="final" aria-labelledby="askH">
      <p class="eyebrow" style="margin:0">One last thing</p>
      <h2 id="askH">Can you forgive me?</h2>
      <div class="answer" id="answer">
        <button class="btn yes" id="yes">Yes</button>
        <button class="btn no" id="no">No</button>
      </div>
      <p class="thanks" id="thanks" hidden></p>
    </section>
  </main>

  <footer>For you.</footer>
</div>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var heart = '<svg class="h" aria-hidden="true"><use href="#heart"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  /* letter */
  var L = $("letter");
  var greet = CONFIG.herName ? "Ente " + esc(CONFIG.herName) + "," : "Ente madam jii,";
  L.innerHTML = '<p class="greet">' + greet + '</p>' +
    CONFIG.letter.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
    '<p class="sign">Ninte swantham, eppozhum<br><b>' + (CONFIG.myName ? esc(CONFIG.myName) + " " : "") + heart + '</b></p>';

  /* envelope */
  var env = $("env"), hint = $("envHint");
  env.addEventListener("click", function () {
    var open = env.getAttribute("aria-expanded") === "true";
    env.setAttribute("aria-expanded", String(!open));
    env.setAttribute("aria-label", open ? "Open the envelope" : "Close the envelope");
    hint.textContent = open ? "Tap the envelope" : "It's right below. Keep reading.";
    if (!open) setTimeout(function () { L.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }, 900);
  });


  /* photos */
  $("photos").innerHTML = CONFIG.photos.map(function (p) {
    var inner = p.src ? '<img src="' + esc(p.src) + '" alt="' + esc(p.caption) + '">' : '<span>' + heart + 'ividey nammude photo varum</span>';
    return '<figure class="polaroid"><div class="shot">' + inner + '</div><figcaption>' + esc(p.caption) + '</figcaption></figure>';
  }).join("");

  /* the question */
  var noBtn = $("no"), yesBtn = $("yes"), answer = $("answer"), tries = 0;
  var noTexts = ["No", "Sure aano?", "Onnoode aalochikku", "Mone Dinesha!", "Last chance da", "Ok ok, Yes thanne press cheyyu"];
  function dodge() {
    tries++;
    var w = answer.clientWidth, bw = noBtn.offsetWidth;
    var range = Math.max(40, Math.min(w - bw - 24, 260));
    noBtn.style.setProperty("--dx", Math.round((Math.random() - 0.5) * range) + "px");
    noBtn.style.setProperty("--dy", Math.round((Math.random() - 0.5) * 70) + "px");
    noBtn.textContent = noTexts[Math.min(tries, noTexts.length - 1)];
    yesBtn.style.setProperty("--yes", Math.min(1 + tries * 0.06, 1.35));
  }
  noBtn.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") dodge(); });
  noBtn.addEventListener("click", dodge);

  var cv = $("confetti"), ctx = cv.getContext("2d");
  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var shape = new Path2D("M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z");
    var cs = getComputedStyle(document.documentElement);
    var cols = [cs.getPropertyValue("--accent"), cs.getPropertyValue("--butter"), cs.getPropertyValue("--env3")];
    var ps = [];
    for (var i = 0; i < 70; i++) ps.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.65, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 12 - 4, s: 0.7 + Math.random() * 1.1, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.2, c: cols[i % 3].trim() });
    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(function (p) {
        p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(p.s, p.s); ctx.translate(-12, -12);
        ctx.globalAlpha = Math.max(0, 1 - age / 3200); ctx.fillStyle = p.c; ctx.fill(shape); ctx.restore();
      });
      if (age < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }
  yesBtn.addEventListener("click", function () {
    answer.hidden = true;
    var th = $("thanks"); th.textContent = CONFIG.thanks; th.hidden = false;
    burst();
  });
})();
